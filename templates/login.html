<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In & Sign Up — MindScan AI</title>
  <meta name="description" content="Sign in or register your account on MindScan AI Mental Health Monitor"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script>
    (function() {
      const theme = localStorage.getItem('mhm_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Top bar: Logo + Theme + Language -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-1">
        <span class="nav-brand-dot"></span>
        <strong style="font-size:1.05rem; color:var(--text-1);">MindScan AI</strong>
      </div>
      <div class="flex items-center gap-1">
        <button class="theme-btn" id="themeToggle" style="width:30px; height:30px; font-size:0.8rem;" title="Toggle Theme">
          <span id="themeIcon">🌙</span>
        </button>
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">HI</button>
          <button class="lang-btn" data-lang="hl">HL</button>
        </div>
      </div>
    </div>

    <!-- Auth Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabSignIn" data-i18n="tab_signin">Sign In</button>
      <button type="button" class="auth-tab" id="tabSignUp" data-i18n="tab_signup">Create Account</button>
    </div>

    <!-- Error Banner -->
    <div id="authError" class="toast error hidden" style="margin-bottom:1rem; position:static;"></div>

    <!-- ── SIGN IN FORM ─────────────────────────────── -->
    <form id="signInForm" onsubmit="return false;">
      <div class="form-group mb-2">
        <label class="form-label" for="loginUsername" data-i18n="lbl_user">Username or Email</label>
        <input class="form-input" type="text" id="loginUsername" placeholder="e.g. student or your email" required/>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="loginPassword" data-i18n="lbl_pwd">Password</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required/>
      </div>

      <button class="btn btn-primary w-full btn-lg" id="btnSubmitLogin" type="submit">
        <span id="txtLogin" data-i18n="btn_signin">Sign In</span>
        <span id="spinLogin" class="spinner hidden"></span>
      </button>
    </form>

    <!-- ── SIGN UP FORM ─────────────────────────────── -->
    <form id="signUpForm" class="hidden" onsubmit="return false;">
      <div class="form-group mb-2">
        <label class="form-label" for="regName" data-i18n="lbl_name">Full Name</label>
        <input class="form-input" type="text" id="regName" placeholder="Enter your full name" required/>
      </div>

      <div class="form-group mb-2">
        <label class="form-label" for="regEmail" data-i18n="lbl_email">Email Address</label>
        <input class="form-input" type="email" id="regEmail" placeholder="e.g. you@gmail.com" required/>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="regPassword" data-i18n="lbl_set_pwd">Create Password</label>
        <input class="form-input" type="password" id="regPassword" placeholder="Minimum 5 characters" required/>
      </div>

      <button class="btn btn-primary w-full btn-lg" id="btnSubmitSignUp" type="submit">
        <span id="txtSignUp" data-i18n="btn_signup">Create My Account</span>
        <span id="spinSignUp" class="spinner hidden"></span>
      </button>
    </form>

  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/main.js"></script>
<script>
// Auth Tab Switching
const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const signInForm = document.getElementById('signInForm');
const signUpForm = document.getElementById('signUpForm');
const errorEl = document.getElementById('authError');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.remove('hidden');
}
function clearError() {
  errorEl.classList.add('hidden');
}

tabSignIn.addEventListener('click', () => {
  tabSignIn.classList.add('active');
  tabSignUp.classList.remove('active');
  signInForm.classList.remove('hidden');
  signUpForm.classList.add('hidden');
  clearError();
});

tabSignUp.addEventListener('click', () => {
  tabSignUp.classList.add('active');
  tabSignIn.classList.remove('active');
  signUpForm.classList.remove('hidden');
  signInForm.classList.add('hidden');
  clearError();
});


// Sign In Submit
document.getElementById('signInForm').addEventListener('submit', async () => {
  clearError();
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnSubmitLogin');
  const txt = document.getElementById('txtLogin');
  const spin = document.getElementById('spinLogin');

  btn.disabled = true; txt.classList.add('hidden'); spin.classList.remove('hidden');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/';
    } else {
      showError(data.detail || 'Invalid username or password.');
    }
  } catch {
    showError('Server connection error. Please ensure backend is running.');
  } finally {
    btn.disabled = false; txt.classList.remove('hidden'); spin.classList.add('hidden');
  }
});

// Sign Up Submit
document.getElementById('signUpForm').addEventListener('submit', async () => {
  clearError();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const btn = document.getElementById('btnSubmitSignUp');
  const txt = document.getElementById('txtSignUp');
  const spin = document.getElementById('spinSignUp');

  btn.disabled = true; txt.classList.add('hidden'); spin.classList.remove('hidden');

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/';
    } else {
      showError(data.detail || 'Sign up failed. Please check your inputs.');
    }
  } catch {
    showError('Server connection error. Please ensure backend is running.');
  } finally {
    btn.disabled = false; txt.classList.remove('hidden'); spin.classList.add('hidden');
  }
});
</script>
</body>
</html>
